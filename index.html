<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>For You</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: #e0f7ff;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      padding: 2rem 1.5rem;
      margin: 1rem;
      width: 100%;
      max-width: 375px;
      text-align: center;
      z-index: 1;
    }
    h1 {
      font-size: 1.75rem;
      color: #0077b6;
    }
    p {
      font-size: 1.05rem;
      margin: 1.25rem 0;
      line-height: 1.5;
    }
    .btn {
      background-color: #00b4d8;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      cursor: pointer;
      margin: 0.5rem;
      width: 100%;
      max-width: 200px;
    }
    .btn:hover {
      background-color: #0096c7;
    }
    .handwritten {
      font-family: 'Dancing Script', cursive;
      font-size: 1.5rem;
      color: #0077b6;
      margin-top: 1rem;
    }
    .heart {
      position: fixed;
      width: 20px;
      height: 20px;
      background-color: #00b4d8;
      transform: rotate(45deg);
      animation: float 4s linear infinite;
      z-index: 0;
    }
    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: #00b4d8;
      border-radius: 50%;
    }
    .heart::before {
      top: -10px;
      left: 0;
    }
    .heart::after {
      left: -10px;
      top: 0;
    }
    @keyframes float {
      0% {
        transform: translateY(0) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-100vh) rotate(45deg);
        opacity: 0;
      }
    }
    @media (max-width: 400px) {
      h1 {
        font-size: 1.5rem;
      }
      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">I just wanted to say...</h1>
    <p id="content">There are so many 'what ifs' in life... But one choice changed everything for me.</p>
    <div id="buttons">
      <button class="btn" onclick="nextPage()">Next</button>
    </div>
  </div>

  <script>
    const pages = [
      {
        title: "Just For You",
        content: "There are so many 'what ifs' in life... But one choice changed everything for me."
      },
      {
        title: "",
        content: "I like to believe that at a certain moment in time, we were meant to meet. I’m grateful I joined that space—and even more thankful you did too."
      },
      {
        title: "",
        content: "You brought light into my life, and with your gentleness, you taught me that I don't have to carry everything alone or be so hard on myself."
      },
      {
        title: "",
        content: "You have my heart, completely. I’ll keep showing you how much you mean to me—with patience, with care, and with understanding. I’ll choose you, wholeheartedly, even on the days when things feel a little harder between us."
      },
      {
        title: "My Dominique",
        content: "I can't imagine my life with anyone but you. You mean so much to me... so, will you be my girlfriend?",
        isFinal: true
      }
    ];

    let pageIndex = 0;

    function nextPage() {
      pageIndex++;
      const page = pages[pageIndex];
      document.getElementById('title').textContent = page.title;
      document.getElementById('content').textContent = page.content;

      const buttons = document.getElementById('buttons');
      buttons.innerHTML = '';

      if (page.isFinal) {
        buttons.innerHTML = `
          <button class="btn" onclick="sayYes()">💙 Yes</button>
          <button class="btn" onclick="sayYes()">😊 Yes</button>
        `;
      } else {
        buttons.innerHTML = `<button class="btn" onclick="nextPage()">Next</button>`;
      }
    }

    function sayYes() {
  document.querySelector('.card').innerHTML = '<p class="handwritten">You’ve just made everything worth it. <br> I love you, my dominique 💙</p>';
  for (let i = 0; i < 30; i++) {
    createHeart();
  }
}
    

    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (2 + Math.random() * 2) + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 4000);
    }
  </script>
</body>
</html>
